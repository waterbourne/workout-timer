<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AB Workout Timer</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .workout-info {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .workout-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
        }

        .workout-meta {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .timer-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
        }

        .timer-display {
            font-size: 80px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            transition: all 0.1s ease;
        }

        .timer-display.work {
            color: #ff6b6b;
        }

        .timer-display.rest {
            color: #4ecdc4;
        }

        .timer-display.complete {
            color: #ffa500;
        }

        .current-exercise {
            text-align: center;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .exercise-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .exercise-demo {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            font-size: 14px;
            line-height: 1.5;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .exercise-demo h4 {
            color: #ffa500;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .phase-indicator {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 15px;
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .phase-work {
            background: linear-gradient(45deg, #ff6b6b, #ff4757);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.4);
        }

        .phase-rest {
            background: linear-gradient(45deg, #4ecdc4, #45b7b8);
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.4);
        }

        .phase-complete {
            background: linear-gradient(45deg, #ffa500, #ff9500);
            box-shadow: 0 0 20px rgba(255, 165, 0, 0.4);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-start {
            background: linear-gradient(45deg, #ff6b6b, #ff4757);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .btn-start:hover {
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-reset {
            background: linear-gradient(45deg, #95a5a6, #7f8c8d);
            box-shadow: 0 4px 15px rgba(149, 165, 166, 0.3);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffa500);
            border-radius: 3px;
            transition: width 0.1s ease;
        }

        .exercise-list {
            margin-top: 20px;
        }

        .exercise-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .exercise-item.active {
            background: rgba(255, 107, 107, 0.2);
            border-color: #ff6b6b;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.2);
        }

        .exercise-item.completed {
            background: rgba(78, 205, 196, 0.1);
            border-color: #4ecdc4;
            opacity: 0.7;
        }

        .exercise-number {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 15px;
            font-size: 14px;
        }

        .exercise-item.completed .exercise-number {
            background: #4ecdc4;
        }

        .exercise-item.active .exercise-number {
            background: #ff6b6b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .tip {
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid rgba(255, 165, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .tip-label {
            color: #ffa500;
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }

        .exercise-descriptions {
            margin-top: 30px;
        }

        .exercise-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .exercise-card.current {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.2);
        }

        .exercise-card.completed {
            opacity: 0.6;
            border-color: #4ecdc4;
            background: rgba(78, 205, 196, 0.05);
        }

        .exercise-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .exercise-number {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 15px;
            font-size: 14px;
        }

        .exercise-card.current .exercise-number {
            background: #ff6b6b;
            animation: pulse 2s infinite;
        }

        .exercise-card.completed .exercise-number {
            background: #4ecdc4;
        }

        .exercise-title {
            font-size: 18px;
            font-weight: 600;
            color: white;
        }

        .exercise-howto {
            margin-bottom: 12px;
        }

        .exercise-howto h4 {
            color: #4ecdc4;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .exercise-steps {
            font-size: 14px;
            line-height: 1.5;
            opacity: 0.9;
        }

        .exercise-form {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .exercise-form h4 {
            color: #ffa500;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .form-points {
            font-size: 13px;
            line-height: 1.4;
            opacity: 0.8;
        }

        .hidden {
            display: none;
        }

        .sound-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sound-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 400px) {
            .container {
                padding: 15px;
            }
            .timer-display {
                font-size: 60px;
            }
            .exercise-name {
                font-size: 18px;
            }
        }

        .install-prompt {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transform: translateY(100px);
            transition: transform 0.3s ease;
        }

        .install-prompt.show {
            transform: translateY(0);
        }

        .install-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            margin-left: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button class="sound-toggle" id="soundToggle" title="Toggle sound">🔊</button>
    
    <div class="container">
        <div class="header">
            <h1>🔥 AB Workout Timer</h1>
        </div>

        <div class="workout-info">
            <div class="workout-title" id="workoutTitle">Loading workout...</div>
            <div class="workout-meta">
                <span id="totalTime">⏱️ 5 min</span>
                <span id="intensity">🔥 High</span>
                <span id="format">📊 45s work / 15s rest</span>
            </div>
        </div>

        <div class="timer-section">
            <div class="phase-indicator phase-work" id="phaseIndicator">GET READY</div>
            <div class="timer-display work" id="timerDisplay">3:00</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="current-exercise" id="currentExercise">
            <div class="exercise-name">Prepare for workout</div>
            <div class="exercise-demo" id="exerciseDemo">
                <h4>🎯 Get Ready</h4>
                <p>Position yourself in your workout space. Have water nearby. The timer will start automatically.</p>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">START</button>
            <button class="btn" id="pauseBtn" onclick="pauseTimer()" style="display:none;">PAUSE</button>
            <button class="btn btn-reset" id="resetBtn" onclick="resetTimer()">RESET</button>
        </div>

        <div class="exercise-list" id="exerciseList"></div>

        <div class="tip" id="workoutTip">
            <span class="tip-label">💡 Tip:</span>
            <span id="tipText">Loading...</span>
        </div>

        <!-- Exercise Descriptions -->
        <div class="exercise-descriptions" id="exerciseDescriptions">
            <!-- Generated by JavaScript -->
        </div>
    </div>

    <div class="install-prompt" id="installPrompt">
        Add to home screen for the best experience!
        <button class="install-btn" onclick="installApp()">Install</button>
        <button class="install-btn" onclick="hideInstallPrompt()" style="background: #95a5a6;">Later</button>
    </div>

    <script src="workouts.js"></script>
    <script src="exercises.js"></script>
    <script src="detailed-exercises.js"></script>
    <script src="real-exercises.js"></script>
    <script src="app.js"></script>
    <script>
        // PWA installation
        let deferredPrompt;
        const installPrompt = document.getElementById('installPrompt');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(() => {
                installPrompt.classList.add('show');
            }, 3000);
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((result) => {
                    deferredPrompt = null;
                    hideInstallPrompt();
                });
            }
        }

        function hideInstallPrompt() {
            installPrompt.classList.remove('show');
        }

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
